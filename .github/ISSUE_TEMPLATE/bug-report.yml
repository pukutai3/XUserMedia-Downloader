name: 不具合報告
description: XUserMedia-Downloaderの再現可能な不具合を報告します
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。認証情報、Cookie、CSRFトークン、非公開メディアは記載しないでください。安全性に関わる問題は公開Issueではなく、Security Policyの非公開窓口から報告してください。
  - type: input
    id: version
    attributes:
      label: ツールのバージョン
      description: 画面上部の「X MEDIA DOWNLOADER / ...」に表示される番号
      placeholder: "2.3.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: ブラウザー
      options:
        - Firefox
        - Chrome
        - Edge
        - その他
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: ブラウザーのバージョン
      placeholder: "例: Firefox 147.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が発生するまでの操作を順番に記載してください
      placeholder: |
        1. x.comを開く
        2. ブックマークを押す
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: コンソールログ
      description: 個人情報を削除した `[XMD ...]` の行だけを貼り付けてください
      render: shell
  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: READMEの「困ったとき」と既存Issueを確認しました
          required: true
        - label: Cookie、トークン、非公開メディアなどの個人情報を含めていません
          required: true
