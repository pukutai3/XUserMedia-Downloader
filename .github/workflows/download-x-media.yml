name: Download X media

on:
  workflow_dispatch:
    inputs:
      username:
        description: "X username (@ is optional)"
        required: true
        type: string
      write_metadata:
        description: "Save post metadata as JSON"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: x-media-download-${{ github.repository }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare X authentication
        id: cookies
        env:
          X_COOKIES_B64: ${{ secrets.X_COOKIES_B64 }}
        shell: bash
        run: |
          if [[ -z "$X_COOKIES_B64" ]]; then
            echo "::error title=X authentication is not configured::Run Setup-XAuthentication.ps1 locally once, then retry this workflow."
            exit 16
          fi

          umask 077
          cookie_path="$RUNNER_TEMP/x-cookies.txt"
          if ! printf '%s' "$X_COOKIES_B64" | base64 --decode > "$cookie_path"; then
            echo "::error title=Invalid X authentication::X_COOKIES_B64 is not valid Base64. Run Setup-XAuthentication.ps1 again."
            exit 16
          fi

          if ! awk -F '\t' '$6 == "auth_token" { auth=1 } $6 == "ct0" { ct0=1 } END { exit !(auth && ct0) }' "$cookie_path"; then
            echo "::error title=Invalid X authentication::Required X cookies are missing. Run Setup-XAuthentication.ps1 again."
            exit 16
          fi

          echo "path=$cookie_path" >> "$GITHUB_OUTPUT"

      - name: Download media
        env:
          X_USERNAME: ${{ inputs.username }}
          WRITE_METADATA: ${{ inputs.write_metadata }}
          COOKIE_PATH: ${{ steps.cookies.outputs.path }}
        shell: bash
        run: |
          args=(python download_x_media.py "$X_USERNAME" --output downloads)
          if [[ "$WRITE_METADATA" == "true" ]]; then
            args+=(--write-metadata)
          fi
          args+=(--cookies "$COOKIE_PATH")
          "${args[@]}"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-media-${{ github.run_id }}
          path: downloads/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
