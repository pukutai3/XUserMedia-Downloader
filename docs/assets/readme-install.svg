<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">XUserMedia-Downloaderの導入と実行</title>
  <desc id="desc">GitHubの導入ページを開き、ボタンをブックマークバーへ登録し、X上でユーザー名を入力する3段階の説明図</desc>
  <rect width="1200" height="620" fill="#f7f6f2"/>
  <style>
    .sans{font-family:Inter,"Noto Sans JP","Yu Gothic UI",sans-serif}.mono{font-family:"IBM Plex Mono","Cascadia Mono",monospace}.h{font-size:28px;font-weight:700;fill:#111}.body{font-size:18px;fill:#343434}.small{font-size:15px;fill:#666}.step{font-size:16px;font-weight:700;fill:#fff}.chrome{fill:#fff;stroke:#191919;stroke-width:2}.rule{stroke:#c8c7c2;stroke-width:1}.blue{fill:#1686f0}.blueText{fill:#1686f0}.dark{fill:#111}
  </style>
  <text x="54" y="58" class="mono h">INSTALL / RUN</text>
  <text x="54" y="91" class="sans body">GitHubから登録し、ログイン済みのXタブで起動します</text>

  <g transform="translate(54 130)">
    <rect width="330" height="400" class="chrome"/>
    <rect width="330" height="54" fill="#111"/>
    <circle cx="26" cy="27" r="7" fill="#f7f6f2"/><text x="48" y="34" class="mono" font-size="17" fill="#fff">GITHUB README</text>
    <circle cx="30" cy="88" r="17" class="blue"/><text x="25" y="94" class="sans step">1</text>
    <text x="58" y="95" class="sans h" font-size="23">導入ページを開く</text>
    <text x="28" y="142" class="sans body">README上部の青いボタンを</text>
    <text x="28" y="170" class="sans body">押します。</text>
    <rect x="28" y="205" width="274" height="62" class="blue"/>
    <text x="62" y="243" class="sans" font-size="18" font-weight="700" fill="#fff">ブックマークへ導入</text>
    <path d="M165 285v55m-10-10 10 10 10-10" fill="none" stroke="#111" stroke-width="3"/>
    <text x="28" y="374" class="sans small">アプリのインストールはありません</text>
  </g>

  <g transform="translate(435 130)">
    <rect width="330" height="400" class="chrome"/>
    <rect width="330" height="54" fill="#fff" stroke="#191919" stroke-width="0 0 2 0"/>
    <circle cx="25" cy="27" r="6" fill="#ff5f57"/><circle cx="45" cy="27" r="6" fill="#febc2e"/><circle cx="65" cy="27" r="6" fill="#28c840"/>
    <rect x="88" y="15" width="220" height="24" fill="#efeee9"/><text x="102" y="32" class="sans small">導入ページ</text>
    <rect x="0" y="54" width="330" height="48" fill="#efeee9"/><text x="18" y="85" class="sans small">ブックマークバー</text>
    <circle cx="30" cy="137" r="17" class="blue"/><text x="25" y="143" class="sans step">2</text>
    <text x="58" y="144" class="sans h" font-size="23">バーへドラッグ</text>
    <rect x="45" y="190" width="240" height="60" class="blue"/>
    <text x="92" y="227" class="sans" font-size="18" font-weight="700" fill="#fff">Xメディア取得</text>
    <path d="M165 266C165 310 125 303 125 341" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="m115 330 10 11 10-11" fill="none" stroke="#111" stroke-width="3"/>
    <rect x="28" y="348" width="170" height="32" fill="#fff" stroke="#191919"/>
    <text x="42" y="370" class="sans small">★ Xメディア取得</text>
  </g>

  <g transform="translate(816 130)">
    <rect width="330" height="400" class="chrome"/>
    <rect width="330" height="54" fill="#111"/>
    <text x="20" y="34" class="mono" font-size="17" fill="#fff">x.com / LOGIN</text>
    <circle cx="30" cy="88" r="17" class="blue"/><text x="25" y="94" class="sans step">3</text>
    <text x="58" y="95" class="sans h" font-size="23">X上で実行</text>
    <text x="28" y="137" class="sans body">ブックマークを押して、対象を</text>
    <text x="28" y="165" class="sans body">入力します。</text>
    <text x="28" y="211" class="sans" font-size="15" font-weight="700">Xユーザー名</text>
    <rect x="28" y="226" width="274" height="52" fill="#fff" stroke="#191919"/>
    <text x="44" y="259" class="sans body">@your_username</text>
    <rect x="28" y="298" width="274" height="58" class="blue"/>
    <text x="102" y="334" class="sans" font-size="18" font-weight="700" fill="#fff">取得を開始</text>
    <text x="28" y="386" class="sans small">ユーザー名・@・URLに対応</text>
  </g>

  <path d="M394 330h31m-10-10 10 10-10 10M775 330h31m-10-10 10 10-10 10" fill="none" stroke="#1686f0" stroke-width="4"/>
  <text x="54" y="580" class="sans small">実行場所: x.com ｜ 認証情報: GitHubへ送信しない ｜ 出力: ブラウザーからZIPを保存</text>
</svg>
