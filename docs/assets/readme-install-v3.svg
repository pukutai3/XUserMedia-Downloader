<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">XUserMedia-Downloaderの実際の導入と起動手順</title>
  <desc id="desc">導入ページを開き、ボタンをブラウザー上部のブックマークツールバーへ登録し、X上でブックマークを押してユーザー名を入力する4段階の説明図</desc>
  <rect width="1200" height="760" fill="#f7f6f2"/>
  <style>
    .sans{font-family:Inter,"Noto Sans JP","Yu Gothic UI",sans-serif}.mono{font-family:"IBM Plex Mono","Cascadia Mono",monospace}.h{font-size:26px;font-weight:700;fill:#111}.body{font-size:17px;fill:#343434}.small{font-size:14px;fill:#606060}.step{font-size:16px;font-weight:700;fill:#fff}.card{fill:#fff;stroke:#191919;stroke-width:2}.blue{fill:#1686f0}.line{fill:none;stroke:#111;stroke-width:3}.arrow{fill:none;stroke:#1686f0;stroke-width:4}
  </style>
  <text x="48" y="52" class="mono h">INSTALL / RUN — ACTUAL FLOW</text>
  <text x="48" y="82" class="sans body">登録場所と、X上で起動する操作を分けて確認します。</text>

  <g transform="translate(48 112)">
    <rect width="530" height="260" rx="2" class="card"/>
    <rect width="530" height="46" fill="#111"/>
    <text x="20" y="30" class="mono" font-size="16" fill="#fff">1 / GITHUB README</text>
    <circle cx="34" cy="83" r="17" class="blue"/><text x="29" y="89" class="sans step">1</text>
    <text x="64" y="90" class="sans h">導入ページを開く</text>
    <text x="26" y="128" class="sans body">README上部の青いボタンを押します。</text>
    <rect x="26" y="153" width="478" height="58" class="blue"/>
    <text x="152" y="189" class="sans" font-size="18" font-weight="700" fill="#fff">ブックマークへ導入</text>
    <text x="26" y="238" class="sans small">→ GitHub Pagesの導入ページが開きます</text>
  </g>

  <g transform="translate(622 112)">
    <rect width="530" height="260" rx="2" class="card"/>
    <rect width="530" height="42" fill="#ecebe6"/>
    <circle cx="22" cy="21" r="6" fill="#ff5f57"/><circle cx="42" cy="21" r="6" fill="#febc2e"/><circle cx="62" cy="21" r="6" fill="#28c840"/>
    <rect x="86" y="10" width="418" height="22" fill="#fff"/><text x="98" y="26" class="sans small">pukutai3.github.io/XUserMedia-Downloader</text>
    <rect y="42" width="530" height="40" fill="#deddd7"/>
    <text x="16" y="67" class="sans small">ブックマークツールバー</text>
    <rect x="184" y="50" width="174" height="25" fill="#fff" stroke="#191919"/>
    <text x="201" y="68" class="sans small">★ Xメディア取得</text>
    <circle cx="34" cy="115" r="17" class="blue"/><text x="29" y="121" class="sans step">2</text>
    <text x="64" y="122" class="sans h">上部のバーへ登録</text>
    <rect x="26" y="155" width="270" height="54" class="blue"/>
    <text x="85" y="189" class="sans" font-size="18" font-weight="700" fill="#fff">Xメディア取得</text>
    <path d="M240 153C268 126 267 102 267 78" class="line" stroke-dasharray="7 5"/>
    <path d="m257 89 10-11 10 11" class="line"/>
    <rect x="312" y="155" width="192" height="54" fill="#fff" stroke="#191919"/>
    <text x="352" y="188" class="sans" font-size="16" font-weight="700">リンクをコピー</text>
    <text x="26" y="236" class="sans small">ドラッグできない時だけ、コピーして新規ブックマークのURL欄へ貼り付け</text>
  </g>

  <g transform="translate(48 422)">
    <rect width="530" height="260" rx="2" class="card"/>
    <rect width="530" height="42" fill="#ecebe6"/>
    <circle cx="22" cy="21" r="6" fill="#ff5f57"/><circle cx="42" cy="21" r="6" fill="#febc2e"/><circle cx="62" cy="21" r="6" fill="#28c840"/>
    <rect x="86" y="10" width="418" height="22" fill="#fff"/><text x="98" y="26" class="sans small">x.com/home</text>
    <rect y="42" width="530" height="40" fill="#deddd7"/>
    <rect x="16" y="50" width="174" height="25" fill="#fff" stroke="#191919"/>
    <text x="33" y="68" class="sans small">★ Xメディア取得</text>
    <circle cx="34" cy="115" r="17" class="blue"/><text x="29" y="121" class="sans step">3</text>
    <text x="64" y="122" class="sans h">X上でブックマークを押す</text>
    <text x="26" y="161" class="sans body">ログイン済みの x.com を開いてから、</text>
    <text x="26" y="188" class="sans body">上部に登録した「Xメディア取得」を押します。</text>
    <path d="M174 155C142 130 107 109 98 80" class="line"/>
    <path d="m90 91 8-12 12 8" class="line"/>
    <text x="26" y="236" class="sans small">GitHubのページ上で押しても起動しません</text>
  </g>

  <g transform="translate(622 422)">
    <rect width="530" height="260" rx="2" class="card"/>
    <rect width="530" height="46" fill="#111"/>
    <text x="20" y="30" class="mono" font-size="16" fill="#fff">X MEDIA DOWNLOADER / 2.3.0</text>
    <circle cx="34" cy="83" r="17" class="blue"/><text x="29" y="89" class="sans step">4</text>
    <text x="64" y="90" class="sans h">対象ユーザーを入力</text>
    <text x="26" y="128" class="sans small">Xユーザー名</text>
    <rect x="26" y="140" width="478" height="50" fill="#fff" stroke="#191919"/>
    <text x="43" y="172" class="sans body">@your_username</text>
    <rect x="26" y="204" width="478" height="42" class="blue"/>
    <text x="209" y="231" class="sans" font-size="17" font-weight="700" fill="#fff">取得を開始</text>
  </g>

  <path d="M586 242h26m-10-10 10 10-10 10M622 382c-18 10-26 22-38 36m2-15-2 15 15-2M586 552h26m-10-10 10 10-10 10" class="arrow"/>
  <text x="48" y="726" class="sans small">登録は導入ページで1回だけ。実行はログイン済みのXタブで行い、ZIPはブラウザーから保存します。</text>
</svg>
