<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">全期間を適応的に分割して取得する仕組み</title>
  <desc id="desc">2006年から現在までを年単位で検索し、少ない期間は結合、多い期間は日単位まで分割し、進捗を保存しながら100件ずつZIPへ出力する図</desc>
  <rect width="1200" height="620" fill="#101114"/>
  <style>
    .sans{font-family:Inter,"Noto Sans JP","Yu Gothic UI",sans-serif}.mono{font-family:"IBM Plex Mono","Cascadia Mono",monospace}.h{font-size:28px;font-weight:700;fill:#fff}.body{font-size:19px;fill:#dededb}.small{font-size:17px;fill:#aaa}.label{font-size:17px;font-weight:700;fill:#101114}.line{stroke:#4a4d52;stroke-width:2}.blue{fill:#1686f0}.paper{fill:#f7f6f2}.muted{fill:#303238}.outline{fill:none;stroke:#777b82;stroke-width:2}
  </style>
  <text x="54" y="58" class="mono h">ARCHIVE SWEEP / 2006 → NOW</text>
  <text x="54" y="91" class="sans body">検索結果の密度に合わせて期間を結合・分割します</text>

  <text x="54" y="146" class="mono small">01 / BASE WINDOWS</text>
  <line x1="54" y1="202" x2="1146" y2="202" class="line"/>
  <g class="sans label">
    <rect x="54" y="174" width="132" height="56" class="paper"/><text x="91" y="208">2006</text>
    <rect x="194" y="174" width="132" height="56" class="paper"/><text x="231" y="208">2007</text>
    <rect x="334" y="174" width="132" height="56" class="paper"/><text x="371" y="208">2008</text>
    <rect x="474" y="174" width="132" height="56" class="blue"/><text x="511" y="208" fill="#fff">2009</text>
    <rect x="614" y="174" width="132" height="56" class="blue"/><text x="651" y="208" fill="#fff">2010</text>
    <rect x="754" y="174" width="132" height="56" class="paper"/><text x="791" y="208">2011</text>
    <rect x="894" y="174" width="112" height="56" class="muted"/><text x="938" y="208" fill="#fff">…</text>
    <rect x="1014" y="174" width="132" height="56" class="paper"/><text x="1051" y="208">現在</text>
  </g>

  <g transform="translate(54 286)">
    <text x="0" y="0" class="mono small">02 / ADAPT</text>
    <rect x="0" y="28" width="330" height="170" class="outline"/>
    <text x="24" y="64" class="sans h" font-size="22">少ない期間</text>
    <text x="24" y="94" class="sans body">隣接する年をまとめる</text>
    <rect x="24" y="120" width="282" height="48" class="paper"/>
    <text x="75" y="151" class="sans label">最大8年を1つの検索窓へ</text>

    <rect x="382" y="28" width="330" height="170" class="outline"/>
    <text x="406" y="64" class="sans h" font-size="22">多い期間</text>
    <text x="406" y="94" class="sans body">100件以上なら半分へ</text>
    <g class="sans label">
      <rect x="406" y="120" width="86" height="48" class="blue"/><text x="429" y="151" fill="#fff">半年</text>
      <rect x="500" y="120" width="86" height="48" class="blue"/><text x="530" y="151" fill="#fff">月</text>
      <rect x="594" y="120" width="94" height="48" class="blue"/><text x="625" y="151" fill="#fff">日</text>
    </g>

    <rect x="764" y="28" width="328" height="170" class="outline"/>
    <text x="788" y="64" class="sans h" font-size="22">中断・制限</text>
    <text x="788" y="94" class="sans body">期間と取得IDを保存</text>
    <rect x="788" y="120" width="280" height="48" class="paper"/>
    <text x="847" y="151" class="sans label">IndexedDBから再開</text>
  </g>

  <path d="M219 500v35h760v-35" fill="none" stroke="#1686f0" stroke-width="4"/>
  <path d="m969 525 10 10 10-10" fill="none" stroke="#1686f0" stroke-width="4"/>
  <g transform="translate(733 545)">
    <rect width="130" height="44" class="paper"/><text x="31" y="28" class="sans label">ZIP 001</text>
    <rect x="140" width="130" height="44" class="paper"/><text x="171" y="28" class="sans label">ZIP 002</text>
    <rect x="280" width="130" height="44" class="blue"/><text x="305" y="28" class="sans" font-size="17" font-weight="700" fill="#fff">ZIP 003…</text>
  </g>
  <text x="54" y="574" class="sans body">重複IDを除外</text>
  <text x="54" y="600" class="sans small">Xが返さない投稿は取得できません</text>
  <text x="1010" y="600" class="mono small">100 ITEMS / ZIP</text>
</svg>
